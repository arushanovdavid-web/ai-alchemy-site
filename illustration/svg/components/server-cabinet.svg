.ia .strand{stroke:var(--ia-ink);stroke-width:calc(.72px*var(--ia-lw))}
.ia .strand.edge{stroke-width:calc(1.15px*var(--ia-lw))}
.ia .ia-link{stroke:var(--ia-ink-2);stroke-width:calc(.9px*var(--ia-lw));stroke-dasharray:7 5}
